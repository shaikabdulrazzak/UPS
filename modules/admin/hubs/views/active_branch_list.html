<div class="container-fluid"  id="main-container">
	<!--Search Start -->
	<div class="row clearfix">
		<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
			<div class="panel-group" id="panel-group-id" role="tablist" aria-multiselectable="true">
				<div class="panel panel-col-pink">
					<div class="panel-heading" role="tab" id="panel-heading-id">
						<h4 class="panel-title">
							<a role="button" data-toggle="collapse" data-target="#panel-collapse-id" data-parent="#panel-group-id" href="javascript:void(0)" aria-expanded="false"
							   aria-controls="panel-collapse-id">
								<%= __("admin.system.search"); %>
								<span class="pull-right collapse-toggle-icon"></span>
							</a>
						</h4>
					</div>
					<div id="panel-collapse-id" class="panel-collapse collapse in" role="tabpanel" aria-labelledby="panel-heading-id">
						<div class="panel-body">
							<form id="searchForm" name="searchForm" >
								<div class="row clearfix dataTables_wrapper">
									<!-- Search by restaurant name -->
									<div class="col-xs-12 col-sm-4">
										<div class="form-group">
											<div class="form-line">
												<select class="form-control show-tick" name="restaurant_name" id="restaurant_ids" data-live-search="true"  data-title="<%=__('admin.hubs.search_by_restaurant')%>" multiple >
													<%-restaurant_list%>
												</select>
											</div>
										</div>
									</div>
									<!-- Search by branch -->
									<div class="col-xs-12 col-sm-4">
										<div class="form-group">
											<div class="form-line">
												<select class="form-control show-tick" id="column_filter_branch_ids" name="search_branch_id" data-live-search="true" data-title="<%=__('admin.hubs.search_by_branches')%>" multiple>

												</select>
											</div>
										</div>
									</div>
									<!-- reset button -->
									<div class="col-xs-12 col-sm-1">
										<button type="button" id="reset" class="btn btn-sm waves-effect btn-danger">
											<%= __("admin.system.reset")%>
										</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!--Search End -->

	<div class="row clearfix">
		<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
			<div class="card">
				<div class="header">
					<h2>
						<%=  __("admin.hubs.branches"); %>
					</h2>
					<ul class="header-dropdown m-r--5 btn-right-top-margin">
						<li class="<%= getPermissionClass(module_type,['hubs','list']); %>">
                            <a href="<%=admin_list_url%>" ><button type="button" class="btn btn-sm bg-indigo waves-effect"><%= __('admin.system.back'); %></button></a>
                        </li>
						<li>
							<a href="javascript:;">
								<button type="button" id="refresh" class="btn btn-sm bg-indigo waves-effect">
									<%=  __("admin.hubs.refresh"); %>
								</button>
							</a>
						</li>
					</ul>
				</div>
				<div class="body">
					<table id="datatable-listing" class="row-border full-length-header hover table table-bordered cb-data-table" cellspacing="0" width="100%">
						<thead>
							<tr>
								<th width="8%"><%= __("admin.hubs.restaurant_name");%></th>
								<th width="8%"><%= __("admin.hubs.branch_name");%></th>
							</tr>
						</thead>
					</table>
				</div>
			</div>
		</div>
	</div>
</div>

<%- contentFor('css') %>
    <link rel="stylesheet" href="<%=WEBSITE_ADMIN_JS_PLUGIN_PATH%>bootstrap-select/css/bootstrap-select.css">

<%- contentFor("script") %>
	<script type="text/javascript" src="<%=WEBSITE_ADMIN_JS_PLUGIN_PATH%>bootstrap-select/js/bootstrap-select.js"></script>
	<script type="text/javascript">
		/** Function to initialize datatable and get server side data*/
		var statusObject 	= 	<%- JSON.stringify(GLOBAL_STATUS_SEARCH_DROPDOWN)%>;
		var dataTable		=	"";
		$(document).ready(function() {
			dataTable = $('#datatable-listing').DataTable({
				"bStateSave"	: true,
				"fnStateSave"	: function (oSettings, oData) {
					localStorage.setItem( 'DataTables', JSON.stringify(oData) );
				},
				"fnStateLoad"	: function (oSettings) {
					return JSON.parse( localStorage.getItem('DataTables') );
				},
				"order"		: 	[],
				"sDom"		:	"ltipr",
				"serverSide": 	true,
				"scrollX"	: 	true,
				"lengthMenu":	PAGING_LENGTH_MENU,
				"columns"	: 	[
				    {
						"data"			: 'restaurant_name',
						"orderable"		:  false,
						"searchable"	:  false
					},
					{
						"data"			:  {},
						"orderable"		:  false,
						"searchable"	:  false,
						"render"		:  function(result){
							return result.name ? result.name[DEFAULT_LANGUAGE_CODE] : ""
						}
					},
				],
				"ajax":{
					url  : "<%=admin_list_url%>/active_branch_list",
					type : "POST",
					data : 	function (d) {
				        d.restaurant_ids=	$('#restaurant_ids').val();
				        d.branch_ids  	=	$('#column_filter_branch_ids').val();
				    },
					dataSrc	: function(res){
						adjustPermissionsClass();
						return res.data;
					}
				},
				"drawCallback": function( settings ) {
					/** Description read more **/
					readMore();
				}
			});
		});

		/** Javascript function to search datatable */
		function searchDatatable(columnNumber){
			var query= $('#column_filter_'+columnNumber).val();
			dataTable.column(columnNumber).search(query).draw()
		}//end searchDatatable()

		$("#restaurant_ids,#column_filter_branch_ids").change(function(){
			dataTable.draw();
		});

		$("#refresh").click(function(){
			dataTable.draw();
		});

		/**
		* Get branch list
		*/
		$("select[name='restaurant_name']").change(function(){
			getBranchDropDownList($(this));
		});

		/**
		* Get branch search dropdown list
		*/
		function getBranchDropDownList(currentObj,restaurantId,branchId){
			if(currentObj){
				var currentValue	=	currentObj.val();
				var childInputName	=	"search_branch_id";
				var childObj		=	(childInputName) ?  $("select[name='"+childInputName+"']") :"";

				if(!currentValue && restaurantId) currentValue = restaurantId;

				childObj.html("");
				if(!branchId) childObj.val("").trigger("change");
				$(".show-tick").selectpicker('refresh');

				if(currentValue){
					/** Get dropdown list **/
					ajaxRequest({
						url 	: "<%=admin_list_url%>/restaurant_branch_dropdown",
						data	: {restaurant_ids : currentValue},
						method	: "post"
					},function(response){
						if(response.status == "<%=STATUS_SUCCESS%>"){
							/** Append dropdown list **/
							childObj.html(response.branch_list);
							if(branchId) childObj.val(branchId);
							$(".show-tick").selectpicker('refresh');
						}else if(response.status && response.message){
							notice(response.status,response.message);
						}
					});
				}
			}

		}// end getBranchDropDownList()
	</script>
	<script type="text/javascript" src="<%=WEBSITE_ADMIN_JS_PATH%>datatable_state_storage.js"></script>
