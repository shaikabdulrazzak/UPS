<div class="row clearfix">
	<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
		<form action="<%=admin_list_url%>/move_drivers/<%=role_id+'/'+user_id%>" data-modal-id="form_modal" id="move_driver_form" data-submit-btn-id="assign_and_shift_btn" method="post" class="on_click_submit" role="form">
			<div class="modal-dialog modal-dialog-centered modal-md"  role="document">
				<div class="modal-content">
					<div class="modal-header modal-header-seperator p-l-20 p-b-0">
						<h2 class="modal-title">
							<%= __("admin.admin_permissions.move_driver"); %>
						</h2>
					</div>
					<div class="modal-body padding-20">
						<div class="row clearfix">
							<div class="col-sm-12">
								<div class="form-group model_select_div">
									<div class="form-line">
										<select name="assign_user" id="assign_user" class="form-control" data-live-search="true">
											<option value=""><%=__('admin.admin_permissions.select_user') %></option>
											<%-user_list%>
										</select>
									</div>
									<span id="assign_user_error" class="error model_select_error"></span>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer modal-footer-seperator">
						<button type="button" id="assign_and_shift_btn" class="btn bg-brown btn-sm waves-effect btn-submit" <%- ADMIN_LOADING_TEXT %> > <%= __("system.submit"); %></button>
						<a href="javascript:void(0);" onclick="$('#form_modal').modal('hide');" ><button type="button" class="btn bg-blue-grey btn-sm waves-effect"><%= __("system.cancel"); %></button></a>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>

<script type="text/javascript">
	$(document).ready(function () {
		setTimeout(function () {
			$("#assign_user").selectpicker('refresh');
		}, 200);
	});

	$(".btn-submit").click(function(){
		var btnId = $(this).attr("id");
		startTextLoading(btnId);
		ajax_submit("move_driver_form",function(status,response){
			if(status){
				$('#form_modal').modal("hide");
				if(response.status && response.message) notice(response.status,response.message);
			}else{
				stopTextLoading(btnId);
			}
		});
	});
</script>
